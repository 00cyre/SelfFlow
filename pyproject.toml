[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selfflow"
version = "0.1.0"
description = "Local API for Google Flow image generation using a browser session"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.50,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
selfflow = "selfflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/selfflow"]
